<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#082754" />
    <meta name="description" content="ソーダの力で街を駆け抜ける、3Dアクションランナー。ステージ1-1、ダウンタウンへ出発！" />
    <title>ソーダヒーロー｜BUBBLE RUNNER</title>
    <script type="module" crossorigin src="./assets/index-CdnKXDAV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C0nOJDfm.css">
  </head>
  <body>
    <div id="game" aria-label="ソーダヒーローの3Dゲーム画面"></div>

    <div class="brand-corner" aria-hidden="true"><span class="brand-symbol">B</span><span>SODA HERO<span class="brand-sub">BUBBLE RUNNER</span></span></div>

    <main id="overlay" class="menu-overlay">
      <section class="menu-card">
        <div id="eyebrow" class="eyebrow"><span class="status-dot"></span>STAGE 1–1 <span class="eyebrow-line"></span> DOWNTOWN</div>
        <div class="title-kicker">走れ。ハジけろ。</div>
        <h1 id="menu-title"><span class="jp-title">ソーダヒーロー</span><span class="en-title">BUBBLE<br /><span>RUNNER</span></span></h1>
        <p id="menu-copy" class="menu-copy">炭酸パワーで、街を駆け抜けろ！<br />よけて、跳んで、くぐって。ゴールへ一直線。</p>
        <div id="menu-stats" class="menu-stats"><div><span class="stat-label">COURSE</span><strong>ダウンタウン</strong></div><div><span class="stat-label">MISSION</span><strong>ソーダ缶を集めろ</strong></div></div>
        <div class="menu-actions"><button id="start" class="start-button" type="button"><span>出発！</span><span class="start-arrow" aria-hidden="true">↗</span></button><button id="secondary" class="secondary-button" type="button" hidden>最初から</button></div>
        <div class="menu-footnote"><span class="tiny-can" aria-hidden="true"></span>シュワッといこう。<span>3D ACTION RUNNER</span></div>
      </section>
      <div class="scene-caption" aria-hidden="true"><span>01</span><div>DOWNTOWN<br /><strong>SODA PARK</strong></div><span class="caption-arrow">↗</span></div>
    </main>

    <section id="hud" class="hud" aria-label="ゲーム情報" hidden>
      <div class="hud-top">
        <div class="hud-left"><div class="distance-box"><span class="hud-label">DISTANCE</span><div><strong id="distance">0</strong><span class="unit">m</span></div></div><div class="score-box"><span class="hud-label">SCORE</span><strong id="score">000000</strong></div></div>
        <div class="hud-right"><div class="life-box"><span class="hud-label">LIFE</span><span id="lives" class="lives">♥ ♥ ♥</span></div><div class="hud-buttons"><button id="sound" class="icon-button" type="button" aria-label="音の切り替え" title="音の切り替え">♪</button><button id="pause" class="icon-button" type="button" aria-label="一時停止" title="一時停止">Ⅱ</button></div></div>
      </div>
      <div class="mission-bar"><span class="mission-star">✦</span><span id="mission">ソーダ缶を集めてゴールへ！</span><span class="stage-tag">1–1</span></div>
      <div class="hud-bottom"><div class="energy-box"><div class="energy-head"><span class="can-icon" aria-hidden="true">▰</span><span>SODA POWER</span><strong id="cans">0</strong></div><div class="gauge-track"><div id="gauge" class="gauge-fill" style="width: 0%"></div></div></div><div class="combo-box"><span>COMBO</span><strong id="combo">0</strong></div></div>
      <div class="progress-track" aria-label="ステージ進行"><div id="progress" class="progress-fill" style="width: 0%"></div></div>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <div id="controls" class="touch-controls" aria-label="タッチ操作"><button type="button" data-action="left" aria-label="左へ">←</button><button type="button" data-action="jump" aria-label="ジャンプ"><span>↑</span><small>JUMP</small></button><button type="button" data-action="slide" aria-label="スライディング"><span>↓</span><small>SLIDE</small></button><button type="button" data-action="right" aria-label="右へ">→</button></div>
    <div class="keyboard-hint"><span><kbd>←</kbd><kbd>→</kbd> 移動</span><span><kbd>SPACE</kbd> ジャンプ</span><span><kbd>↓</kbd> スライド</span><span><kbd>Esc</kbd> 一時停止</span></div>
    <pre id="debug" hidden></pre>
  </body>
</html>
